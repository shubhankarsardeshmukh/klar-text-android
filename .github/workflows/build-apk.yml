name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Allow gradlew to run
        run: chmod +x gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: Klartext-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
